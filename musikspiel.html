<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Musik-Ratespiel (Spotify-Version)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #eee;
      text-align: center;
      padding: 20px;
    }
    .game-box {
      background: #222;
      padding: 20px;
      border-radius: 10px;
      max-width: 500px;
      margin: auto;
    }
    input {
      width: 90%;
      padding: 8px;
      margin: 5px 0;
      border-radius: 5px;
      border: none;
    }
    button, a.button-link {
      display: inline-block;
      padding: 10px 20px;
      margin: 10px 5px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      text-decoration: none;
      color: #fff;
    }
    #playLink { background: #1DB954; } /* Spotify-Grün */
    #checkBtn { background: #10b981; }
    #nextBtn { background: #3b82f6; }
    #status { margin-top: 10px; font-size: 1.1em; }
  </style>
</head>
<body>

  <h1>🎵 Musik-Ratespiel</h1>
  <p>Tippe auf „Song abspielen“, um den Titel in Spotify zu hören.</p>

  <div class="game-box">

    <!-- WICHTIG: echter Link, kein Button -->
    <a id="playLink" class="button-link" href="#" target="_blank" rel="noopener noreferrer">
      Song abspielen
    </a>

    <input id="titleInput" type="text" placeholder="Songtitel">
    <input id="artistInput" type="text" placeholder="Interpret">

    <br>
    <button id="checkBtn">Antwort prüfen</button>
    <button id="nextBtn" disabled>Nächster Song</button>

    <div id="status"></div>
    <div id="score"></div>
  </div>

  <script>
    const songs = [
      {
        title: "Billie Jean",
        artist: "Michael Jackson",
        trackId: "5ChkMS8OtdzJeqyybCc9R5"
      },
      {
        title: "Smells Like Teen Spirit",
        artist: "Nirvana",
        trackId: "5ghIJDpPoe3CfHMGu71E6T"
      },
      {
        title: "Shape of You",
        artist: "Ed Sheeran",
        trackId: "7qiZfU4dY1lWllzX7mPBI3"
      }
    ];

    let currentIndex = 0;
    let score = 0;
    let total = 0;
    let answered = false;

    function updatePlayLink() {
      const s = songs[currentIndex];
      const webLink = `https://open.spotify.com/track/${s.trackId}`;
      const playLink = document.getElementById("playLink");
      playLink.href = webLink;
    }

    function loadSong() {
      answered = false;
      document.getElementById("titleInput").value = "";
      document.getElementById("artistInput").value = "";
      document.getElementById("status").textContent = "";
      document.getElementById("checkBtn").disabled = false;
      document.getElementById("nextBtn").disabled = true;
      updateScore();
      updatePlayLink();
    }

    function normalize(str) {
      return str.trim().toLowerCase();
    }

    document.getElementById("checkBtn").addEventListener("click", () => {
      if (answered) return;

      const s = songs[currentIndex];
      const userTitle = normalize(document.getElementById("titleInput").value);
      const userArtist = normalize(document.getElementById("artistInput").value);

      const correctTitle = normalize(s.title);
      const correctArtist = normalize(s.artist);

      let correctParts = 0;
      if (userTitle && correctTitle.includes(userTitle)) correctParts++;
      if (userArtist && correctArtist.includes(userArtist)) correctParts++;

      total++;

      const status = document.getElementById("status");

      if (correctParts === 2) {
        score++;
        status.textContent = "Volltreffer! 🎉";
        status.style.color = "#10b981";
      } else if (correctParts === 1) {
        score += 0.5;
        status.textContent = `Teilweise richtig! Gesucht war: ${s.title} – ${s.artist}`;
        status.style.color = "#f59e0b";
      } else {
        status.textContent = `Leider falsch. Gesucht war: ${s.title} – ${s.artist}`;
        status.style.color = "#ef4444";
      }

      answered = true;
      document.getElementById("checkBtn").disabled = true;
      document.getElementById("nextBtn").disabled = false;

      updateScore();
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
      currentIndex = (currentIndex + 1) % songs.length;
      loadSong();
    });

    function updateScore() {
      document.getElementById("score").textContent =
        `Punkte: ${score} / ${total}`;
    }

    loadSong();
  </script>

</body>
</html>
