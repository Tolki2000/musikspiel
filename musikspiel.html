<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Musik-Quiz Mix</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      text-align: center;
      padding: 20px;
    }
    .game-box {
      background: #111827;
      padding: 20px;
      border-radius: 12px;
      max-width: 600px;
      margin: auto;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    h1 {
      margin-bottom: 10px;
    }
    #questionType {
      font-size: 0.9em;
      color: #9ca3af;
      margin-bottom: 8px;
    }
    #questionText {
      font-size: 1.2em;
      margin: 10px 0 18px;
    }
    .emoji {
      font-size: 2.2em;
      margin-bottom: 10px;
    }
    .answer-btn {
      width: 95%;
      padding: 10px;
      margin: 6px 0;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      background: #1f2937;
      color: #e5e7eb;
      transition: background 0.15s, transform 0.05s;
    }
    .answer-btn:hover {
      background: #374151;
      transform: translateY(-1px);
    }
    .answer-btn:disabled {
      opacity: 0.6;
      cursor: default;
      transform: none;
    }
    #nextBtn, #startBtn, #endBtn {
      padding: 10px 20px;
      margin: 14px 5px 0;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      background: #3b82f6;
      color: #fff;
    }
    #nextBtn:disabled {
      opacity: 0.5;
      cursor: default;
    }
    #endBtn {
      background: #dc2626;
    }
    #status {
      margin-top: 12px;
      font-size: 1.05em;
      min-height: 1.2em;
    }
    #score {
      margin-top: 6px;
      font-size: 0.95em;
      color: #9ca3af;
    }
    .category-box {
      text-align: left;
      margin: 10px auto;
      max-width: 300px;
    }
    .category-box label {
      display: block;
      margin: 6px 0;
      cursor: pointer;
    }
  </style>
</head>
<body>
	<div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
  <img src="logo.png" alt="Musik-Quiz Logo" style="width:120px;height:auto;">
  <h1>🎵 Musik-Quiz Mix</h1>
</div>

  <p>Emoji-Rätsel, Hinweise, Interpreten-Fragen und Wortwolken – alles in einem Spiel.</p>

  <!-- STARTSCREEN -->
  <div class="game-box" id="categoryScreen">
    <h2>Kategorien auswählen</h2>

    <div class="category-box">
      <label><input type="checkbox" value="Emoji-Rätsel" checked> Emoji-Rätsel</label>
      <label><input type="checkbox" value="Hinweis-Quiz" checked> Hinweis-Quiz</label>
      <label><input type="checkbox" value="Interpreten-Quiz" checked> Interpreten-Quiz</label>
      <label><input type="checkbox" value="Wortwolke" checked> Wortwolke</label>
    </div>

    <button id="startBtn">Spiel starten</button>
  </div>

  <!-- QUIZSCREEN -->
  <div class="game-box" id="quizScreen" style="display:none;">
    <div id="questionType"></div>
    <div id="questionText"></div>

    <div id="answers"></div>

    <button id="nextBtn" disabled>Nächste Frage</button>
    <button id="endBtn">Beenden</button>

    <div id="status"></div>
    <div id="score"></div>
  </div>

  <!-- Fragen laden -->
  <script src="questions.js"></script>

  <script>
    let selectedCategories = [];
    let questionPool = [];
    let currentQuestion = null;
    let score = 0;
    let questionIndex = 0;

    const startBtn = document.getElementById("startBtn");
    const nextBtn = document.getElementById("nextBtn");
    const endBtn = document.getElementById("endBtn");

    const categoryScreen = document.getElementById("categoryScreen");
    const quizScreen = document.getElementById("quizScreen");

    const questionType = document.getElementById("questionType");
    const questionText = document.getElementById("questionText");
    const answersDiv = document.getElementById("answers");
    const statusDiv = document.getElementById("status");
    const scoreDiv = document.getElementById("score");

    function shuffle(arr) {
      return arr.sort(() => Math.random() - 0.5);
    }

    startBtn.onclick = () => {
      const checkboxes = document.querySelectorAll(".category-box input");
      selectedCategories = [...checkboxes].filter(c => c.checked).map(c => c.value);

      questionPool = [];

      if (selectedCategories.includes("Emoji-Rätsel")) questionPool.push(...emojiQuestions);
      if (selectedCategories.includes("Hinweis-Quiz")) questionPool.push(...hintQuestions);
      if (selectedCategories.includes("Interpreten-Quiz")) questionPool.push(...artistQuestions);
      if (selectedCategories.includes("Wortwolke")) questionPool.push(...wordcloudQuestions);

      questionPool = shuffle(questionPool);

      score = 0;
      questionIndex = 0;

      categoryScreen.style.display = "none";
      quizScreen.style.display = "block";

      loadQuestion();
    };

    function loadQuestion() {
      currentQuestion = questionPool[questionIndex];

      questionType.textContent = currentQuestion.type;

      if (currentQuestion.display) {
        questionText.innerHTML = `<div class="emoji">${currentQuestion.display}</div>`;
      } else if (currentQuestion.hints) {
        questionText.innerHTML = currentQuestion.hints.map(h => "• " + h).join("<br>");
      } else if (currentQuestion.description) {
        questionText.textContent = currentQuestion.description;
      } else if (currentQuestion.words) {
        questionText.innerHTML = currentQuestion.words.join(" • ");
      }

      answersDiv.innerHTML = "";
      statusDiv.textContent = "";
      nextBtn.disabled = true;

      const shuffled = shuffle([...currentQuestion.options]);

      shuffled.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "answer-btn";
        btn.textContent = opt;

        btn.onclick = () => {
          if (opt === currentQuestion.correct) {
            score++;
            statusDiv.textContent = "✔️ Richtig!";
            statusDiv.style.color = "#22c55e";
          } else {
            statusDiv.textContent = "❌ Falsch!";
            statusDiv.style.color = "#ef4444";
          }

          document.querySelectorAll(".answer-btn").forEach(b => b.disabled = true);
          nextBtn.disabled = false;

          scoreDiv.textContent = `Punkte: ${score} / ${questionPool.length}`;
        };

        answersDiv.appendChild(btn);
      });
    }

    nextBtn.onclick = () => {
      questionIndex++;
      if (questionIndex >= questionPool.length) {
        statusDiv.textContent = "🎉 Quiz beendet!";
        nextBtn.disabled = true;
        return;
      }
      loadQuestion();
    };

    endBtn.onclick = () => {
      location.reload();
    };
  </script>

</body>
</html>
