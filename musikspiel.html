<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Musik-Ratespiel (Spotify + Multiple Choice)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #eee;
      text-align: center;
      padding: 20px;
    }
    .game-box {
      background: #222;
      padding: 20px;
      border-radius: 10px;
      max-width: 500px;
      margin: auto;
    }
    .answer-btn {
      width: 90%;
      padding: 10px;
      margin: 6px 0;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      background: #333;
      color: #eee;
    }
    .answer-btn:hover {
      background: #444;
    }
    #playLink {
      display: inline-block;
      padding: 10px 20px;
      margin: 10px 5px;
      border-radius: 5px;
      background: #1DB954;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }
    #nextBtn {
      padding: 10px 20px;
      margin: 10px 5px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      background: #3b82f6;
      color: #fff;
    }
    #status { margin-top: 10px; font-size: 1.1em; }
  </style>
</head>
<body>

  <h1>🎵 Musik-Ratespiel</h1>
  <p>Tippe auf „Song abspielen“, um den Titel in Spotify zu hören.</p>

  <div class="game-box">

    <!-- WICHTIG: echter App-Link -->
    <a id="playLink" href="#">Song abspielen</a>

    <h3>Welche Antwort ist richtig?</h3>
    <div id="answers"></div>

    <button id="nextBtn" disabled>Nächster Song</button>

    <div id="status"></div>
    <div id="score"></div>
  </div>

  <script>
    const songs = [
      { title: "Billie Jean", artist: "Michael Jackson", trackId: "5ChkMS8OtdzJeqyybCc9R5" },
      { title: "Smells Like Teen Spirit", artist: "Nirvana", trackId: "5ghIJDpPoe3CfHMGu71E6T" },
      { title: "Shape of You", artist: "Ed Sheeran", trackId: "7qiZfU4dY1lWllzX7mPBI3" },
      { title: "Poker Face", artist: "Lady Gaga", trackId: "1a1t2cJtQ2Y" },
      { title: "Rolling in the Deep", artist: "Adele", trackId: "6I9VzXrHxO9rA9A5euc8Ak" },
      { title: "Wonderwall", artist: "Oasis", trackId: "2Gf2i2qZtq" }
    ];

    let currentIndex = 0;
    let score = 0;
    let total = 0;
    let answered = false;

    function updatePlayLink() {
      const s = songs[currentIndex];

      // DIREKT den App-Link setzen
      const appLink = `spotify:track:${s.trackId}`;

      const playLink = document.getElementById("playLink");
      playLink.href = appLink;

      // KEIN preventDefault, KEIN window.location, KEIN Fallback
      // → sonst blockiert Windows Chrome den Start
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function loadSong() {
      answered = false;
      document.getElementById("status").textContent = "";
      document.getElementById("nextBtn").disabled = true;

      updatePlayLink();

      const s = songs[currentIndex];
      const answersDiv = document.getElementById("answers");
      answersDiv.innerHTML = "";

      const correct = `${s.title} – ${s.artist}`;

      let wrong = songs
        .filter((_, i) => i !== currentIndex)
        .map(x => `${x.title} – ${x.artist}`);

      wrong = shuffle(wrong).slice(0, 5);

      const options = shuffle([correct, ...wrong]);

      options.forEach(option => {
        const btn = document.createElement("button");
        btn.className = "answer-btn";
        btn.textContent = option;
        btn.onclick = () => checkAnswer(option, correct);
        answersDiv.appendChild(btn);
      });

      updateScore();
    }

    function checkAnswer(selected, correct) {
      if (answered) return;
      answered = true;

      total++;

      const status = document.getElementById("status");

      if (selected === correct) {
        score++;
        status.textContent = "Richtig! 🎉";
        status.style.color = "#10b981";
      } else {
        status.textContent = `Falsch! Gesucht war: ${correct}`;
        status.style.color = "#ef4444";
      }

      document.getElementById("nextBtn").disabled = false;
      updateScore();
    }

    document.getElementById("nextBtn").addEventListener("click", () => {
      currentIndex = (currentIndex + 1) % songs.length;
      loadSong();
    });

    function updateScore() {
      document.getElementById("score").textContent =
        `Punkte: ${score} / ${total}`;
    }

    window.addEventListener("DOMContentLoaded", () => {
      loadSong();
    });
  </script>

</body>
</html>
